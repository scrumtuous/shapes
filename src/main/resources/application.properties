spring.datasource.url=jdbc:h2:mem:storedb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# The embedded broker supplies spring.kafka.bootstrap-servers at startup.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.mcnz.store
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.apache.kafka=WARN
logging.level.kafka=WARN
logging.level.state.change.logger=WARN

#---
spring.config.activate.on-profile=prod

# Amazon MSK IAM bootstrap brokers (private VPC endpoints).
spring.kafka.bootstrap-servers=b-1.storecluster.33kyzc.c17.kafka.us-east-1.amazonaws.com:9098,b-2.storecluster.33kyzc.c17.kafka.us-east-1.amazonaws.com:9098
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=AWS_MSK_IAM
spring.kafka.properties.sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
spring.kafka.properties.sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler
